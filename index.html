<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF8F1">
<title>上海中职贯通地图</title>
<style>
:root{
  --bg:#FFF8F1; --card:#FFFFFF; --ink:#241C1A; --sub:#8A7A72; --line:#F2E3D5;
  --red:#FF4D3D; --gold:#F5A623; --mint:#12A66A; --blue:#2E6BF6;
  --sh:0 8px 28px rgba(150,100,70,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  overscroll-behavior-y:none;
}
button{font-family:inherit;border:0;background:none;color:inherit;padding:0;cursor:pointer}
em{font-style:normal}

/* ---------- stage：首页只有地图 ---------- */
.stage{height:100dvh;min-height:520px;max-width:600px;margin:0 auto;padding:8px 4px 14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#map{display:block;width:100%;height:auto;touch-action:manipulation}
.hd{width:100%;padding:0 16px;flex:none}
.hd h1{font-size:22px;margin:0;letter-spacing:-.4px;font-weight:800}
.hd p{font-size:12px;color:var(--sub);margin:4px 0 0}
.zoomBtn{background:#2A211E;color:#fff;font-size:12px;font-weight:600;padding:7px 12px;
  border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.16);margin-top:11px}
.ft{width:100%;flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px}
.hint{font-size:10.5px;color:#BCA99E;text-align:center}
.searchBtn{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;
  font-size:12.5px;font-weight:600;color:var(--sub);box-shadow:0 6px 20px rgba(150,100,70,.12);white-space:nowrap}
/* 小红书小程序：顶部原生返回/胶囊会「退出小程序」，所有控件一律避让 */
body.in-xhs .hd{padding-top:52px}
body.in-xhs .pbar{padding-top:50px}

/* ---------- map ---------- */
.dp{stroke:#fff;stroke-width:1.2;transition:fill .18s;cursor:pointer}
.lbl{font-size:25px;font-weight:700;fill:#544133;pointer-events:none;text-anchor:middle;
  letter-spacing:.5px;paint-order:stroke fill;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round}
.lbl.sm{font-size:9px;stroke-width:1.6px}
.lbl.cnt{font-size:17px;font-weight:800;fill:#C2410C;letter-spacing:0}
.lbl.cnt.sm{font-size:8px}
.lbl.cent{fill:#2A211E}

/* ---------- cards ---------- */
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;
  padding:13px 14px;margin-bottom:9px;box-shadow:0 3px 12px rgba(150,100,70,.06);cursor:pointer;
  border:1px solid #FDF1E7}
.card:active{transform:scale(.988)}
.rank{width:24px;text-align:center;font-size:13px;font-weight:800;color:#C9B7AB;flex:none}
.rank.top{color:var(--red)}
.cbody{flex:1;min-width:0}
.ctitle{font-size:14.5px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdesc{font-size:11.5px;color:var(--sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdesc.fl{display:flex;align-items:center;gap:4px;white-space:nowrap}
.cdesc.fl .tag{flex:none}
.cdesc.fl .un{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cdesc.fl .ub{flex:none}
.cscore{text-align:right;flex:none}
.cscore b{display:block;font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums}
.cscore i{font-size:10.5px;color:var(--sub);display:block}
.cscore b.s2{font-size:13px;color:#9C8A80;margin-top:4px}
.cscore i.s2{font-size:9.5px;color:#B7A399}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:6px;font-weight:700;line-height:1.6}
.t-b{background:#FFEDE8;color:#D9331B}
.t-g{background:#E6F6EE;color:#0C7A4D}
.t-f{background:#EAF0FF;color:#1E4FD6}
.t-n{background:#F4EFEA;color:#8A7A72}
.ub{display:inline-block;font-size:9.5px;line-height:1.6;padding:0 4px;border-radius:4px;
  font-weight:700;vertical-align:1px;margin-left:3px}
.ub-pub{background:#EAF0FF;color:#1E4FD6}
.ub-pri{background:#FFEEDD;color:#B45309}
.ub-lv{background:#F4EFEA;color:#8A7A72}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:11px;color:var(--sub)}

/* ---------- sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(40,24,16,.34);opacity:0;pointer-events:none;
  transition:opacity .22s;z-index:40;backdrop-filter:blur(2px)}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);
  border-radius:24px 24px 0 0;max-height:82vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -10px 40px rgba(60,30,10,.16);max-width:600px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:#E4D3C6;margin:9px auto 2px;flex:none}
.shead{display:flex;align-items:flex-end;justify-content:space-between;padding:6px 18px 10px;flex:none}
.shead h2{margin:0;font-size:20px;font-weight:800}
.shead p{margin:2px 0 0;font-size:12px;color:var(--sub)}
.sbody{overflow-y:auto;padding:0 14px 26px;-webkit-overflow-scrolling:touch}

/* ---------- page ---------- */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.3,1);
  -webkit-overflow-scrolling:touch}
.page.on{transform:translateX(0)}
.pbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:11px 14px;background:rgba(255,248,241,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.back{width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(150,100,70,.12);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.pbar .tt{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{padding:14px 16px 46px;max-width:560px;margin:0 auto}
.hero{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh)}
.hero h1{font-size:19px;margin:6px 0 8px;line-height:1.35;font-weight:800}
.hero .meta{font-size:12.5px;color:var(--sub);display:flex;flex-direction:column;gap:5px}
.hero .meta div{display:flex;gap:7px}
.hero .meta b{color:#B9A398;font-weight:600;flex:none;width:52px}
.hero .meta span{color:#3C302B}

.tabs{display:flex;gap:7px;margin:16px 0 12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:999px;
  background:#fff;border:1px solid var(--line);color:var(--sub)}
.tab.on{background:#2A211E;border-color:#2A211E;color:#fff}

.score{display:flex;align-items:flex-end;gap:14px;background:#fff;border-radius:20px;padding:16px;
  box-shadow:var(--sh);margin-bottom:12px}
.score .big{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.score .big small{font-size:12px;font-weight:600;color:var(--sub);margin-left:3px;letter-spacing:0}
.score .delta{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:8px}
.up{background:#FFEDE8;color:#D9331B} .down{background:#E6F6EE;color:#0C7A4D} .flat{background:#F4EFEA;color:var(--sub)}
.bars{display:flex;gap:6px;margin-top:4px}
.bar{flex:1;background:#FFF3E9;border-radius:9px;padding:7px 6px;text-align:center}
.bar b{display:block;font-size:15px;font-variant-numeric:tabular-nums;line-height:1.25}
.bar i{font-size:10px;color:var(--sub);font-style:normal}

.blk{background:#fff;border-radius:18px;padding:15px 16px;box-shadow:var(--sh);margin-bottom:12px}
.blk h3{font-size:13.5px;margin:0 0 9px;font-weight:800;display:flex;align-items:center;gap:6px}
.blk h3::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--red)}
.blk p{margin:0;font-size:13.5px;line-height:1.72;color:#3C302B}
.note{font-size:11.5px;color:var(--sub);line-height:1.6;background:#FFF3E6;border-radius:12px;padding:10px 12px}
.mut{color:var(--sub)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:26px 0}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;margin-bottom:12px;box-shadow:0 3px 12px rgba(150,100,70,.05)}
.search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;color:var(--ink)}
.search input::placeholder{color:#C0AFA5}
</style>
</head>
<body>

<div class="stage">
  <div class="hd">
    <h1>上海中职贯通地图</h1>
    <p>点一个区，看这个区有几所学校、几条赛道</p>
    <button class="zoomBtn" id="zoomBtn">中心城区</button>
  </div>
  <svg id="map" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="ft">
    <div class="hint">数字 = 该区贯通学校数 · 颜色越深 = 专业点越多</div>
    <button class="searchBtn" id="searchBtn">🔍 搜学校 / 专业 / 高校</button>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shead"><div><h2 id="shTitle"></h2><p id="shSub"></p></div>
    <button id="shClose" style="font-size:12.5px;color:var(--sub)">关闭</button></div>
  <div class="sbody" id="shBody"></div>
</div>

<div class="page" id="schoolPage">
  <div class="pbar"><button class="back" data-back>‹</button><div class="tt" id="spTitle"></div></div>
  <div class="pbody" id="spBody"></div>
</div>

<div class="page" id="progPage">
  <div class="pbar"><button class="back" data-back>‹</button><div class="tt" id="ppTitle"></div></div>
  <div class="pbody" id="ppBody"></div>
</div>

<div class="page" id="searchPage">
  <div class="pbar"><button class="back" data-back>‹</button><div class="tt">搜索</div></div>
  <div class="pbody" id="seBody"></div>
</div>

/* 贯通高校 公办 / 民办 */
function uniTag(u){
  const i = D.unis && D.unis[u];
  if(!i || !i.n) return "";
  const cls = i.n.indexOf("公办")>=0 ? "ub-pub" : "ub-pri";
  return `<span class="ub ${cls}">${esc(i.n)}</span>`;
}
function uniLv(u){
  const i = D.unis && D.unis[u];
  return (i && i.l) ? `<span class="ub ub-lv">${esc(i.l)}</span>` : "";
}

/* ---------- map ---------- */
const mapEl = $("#map");
let zoomed = false;
const FULL = (D.bbox || [0,0,1000,1000]).join(" ");
const maxC = Math.max(...D.districts.map(d=>d.c));
function fill(c){
  const t = maxC ? Math.pow(c/maxC,.55) : 0;
  return `rgb(255,${Math.round(233-113*t)},${Math.round(220-160*t)})`;
}
const scOf = n => (D.ds[n]||[]).length;

function drawMap(){
  mapEl.setAttribute("viewBox", zoomed ? D.central.join(" ") : FULL);
  let out = "";
  D.districts.forEach(d=>{
    out += `<path class="dp" data-d="${d.n}" fill="${fill(d.c)}" d="${d.d}"></path>`;
  });
  D.districts.forEach(d=>{
    if(!zoomed && CT.includes(d.n)) return;
    const sc = scOf(d.n);
    if(zoomed){
      out += `<text class="lbl sm" x="${d.cx}" y="${d.cy-1}">${d.n.replace("新区","")}</text>`
           + `<text class="lbl cnt sm" x="${d.cx}" y="${d.cy+9}">${sc}校</text>`;
    } else {
      out += `<text class="lbl" x="${d.cx}" y="${d.cy-3}">${d.n.replace("新区","")}</text>`
           + `<text class="lbl cnt" x="${d.cx}" y="${d.cy+21}">${sc} 校</text>`;
    }
  });
  if(!zoomed){
    const c = D.central;
    const cx = c[0]+c[2]/2, cy = c[1]+c[3]/2;
    const cen = new Set();
    CT.forEach(n => (D.ds[n]||[]).forEach(i => cen.add(i)));
    out += `<text class="lbl cent" id="centLbl" style="font-size:17px" x="${cx}" y="${cy+2}">中心城区</text>`
         + `<text class="lbl cnt" id="centCnt" style="font-size:14px" x="${cx}" y="${cy+22}">${cen.size} 校</text>`;
  }
  mapEl.innerHTML = out;
  mapEl.querySelectorAll(".dp").forEach(p=>{
    p.addEventListener("click", ()=>openDistrict(p.dataset.d));
  });
  const cl = document.getElementById("centLbl");
  if(cl){
    [cl, document.getElementById("centCnt")].forEach(el=>{
      if(el){ el.style.pointerEvents = "auto"; el.style.cursor = "pointer"; el.onclick = ()=>zb.click(); }
    });
  }
}
const zb = $("#zoomBtn");
zb.onclick = ()=>{
  zoomed = !zoomed;
  drawMap();
  zb.textContent = zoomed ? "‹ 返回全市" : "中心城区";
};
drawMap();

/* ---------- district sheet ---------- */
function openSheet(){ $("#sheet").classList.add("on"); $("#mask").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#mask").classList.remove("on"); }
$("#mask").onclick = closeSheet;
$("#shClose").onclick = closeSheet;

function schoolCard(si, rank){
  const s = D.schools[si];
  const ps = s.idx.map(i=>D.progs[i]);
  const ben = ps.filter(p=>isBen(p.t) && p.a26).map(p=>p.a26);
  const pu = ps.filter(p=>!isBen(p.t) && p.a26).map(p=>p.a26);
  const benMax = ben.length ? Math.max(...ben) : null;
  const puMax = pu.length ? Math.max(...pu) : null;
  const nBen = ps.filter(p=>isBen(p.t)).length;
  const sh = (benMax!=null ? `<b>${fmt(benMax)}</b><i>中本 · 660</i>` : "")
           + (puMax!=null ? `<b class="s2">${fmt(puMax)}</b><i class="s2">专科 · 450</i>` : "");
  return `<div class="card" data-si="${si}">
    ${rank ? `<div class="rank ${rank<=3?"top":""}">${rank}</div>` : ""}
    <div class="cbody">
      <div class="ctitle">${esc(s.n)}</div>
      <div class="cdesc">${s.nature||"民办"} · ${ps.length} 个专业点${nBen?` · <b style="color:#D9331B">中本 ${nBen}</b>`:""}</div>
    </div>
    <div class="cscore">${sh || `<b>—</b><i>暂无线</i>`}</div>
  </div>`;
}

function openDistrict(name){
  const list = D.ds[name] || [];
  const cnt = D.progs.filter(p=>(p.d||[]).includes(name)).length;
  $("#shTitle").textContent = (name==="浦东" ? "浦东新区" : name + (CT.includes(name) ? "区" : ""));
  $("#shSub").textContent = `${list.length} 所学校 · ${cnt} 个贯通专业点`;
  $("#shBody").innerHTML = list.length
    ? list.map((si,i)=>schoolCard(si,i+1)).join("")
    : `<div class="empty">这个区暂无贯通专业点</div>`;
  bindCards($("#shBody"));
  openSheet();
}

/* ---------- school ---------- */
let curSchool = null, curTab = "all";
function openSchool(si){
  curSchool = si; curTab = "all";
  const s = D.schools[si];
  $("#spTitle").textContent = s.n;
  const ps = s.idx.map(i=>D.progs[i]);
  const cnt = {all: ps.length};
  ps.forEach(p => cnt[p.t] = (cnt[p.t]||0)+1);
  const tabs = [["all","全部"]].concat(D.types.filter(t=>cnt[t]).map(t=>[t,`${t} ${cnt[t]}`]));
  $("#spBody").innerHTML = `
    <div class="hero">
      <span class="tag ${s.p?"t-b":"t-g"}">${s.p?"民办":"公办"}</span>
      <h1>${esc(s.n)}</h1>
      <div class="meta">
        ${s.addr?`<div><b>地址</b><span>${esc(s.addr)}</span></div>`:""}
        ${s.tel?`<div><b>电话</b><span>${esc(s.tel)}</span></div>`:""}
        <div><b>赛道</b><span>${D.types.filter(t=>cnt[t]).map(t=>`${t} ${cnt[t]}`).join(" · ")}</span></div>
      </div>
    </div>
    <div class="tabs" id="spTabs">${tabs.map(([k,l])=>`<button class="tab ${k===curTab?"on":""}" data-tab="${k}">${l}</button>`).join("")}</div>
    <div id="spList"></div>`;
  $("#spBody").querySelectorAll("[data-tab]").forEach(b=>{
    b.onclick = ()=>{
      curTab = b.dataset.tab;
      $("#spTabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x.dataset.tab===curTab));
      renderSchoolList();
    };
  });
  renderSchoolList();
  pushPage("#schoolPage");
}
function renderSchoolList(){
  const s = D.schools[curSchool];
  const ps = s.idx.map(i=>D.progs[i]).filter(p=>curTab==="all" || p.t===curTab);
  $("#spList").innerHTML = ps.map(p=>{
    const d = p.d1;
    const dl = d==null ? `<span class="pill">2026 ${fmt(p.a26)}</span>`
      : `<span class="pill">2026 <b style="color:${d>0?"#D9331B":"#0C7A4D"}">${fmt(p.a26)}</b> ${d>0?"↑":"↓"}${fmt(Math.abs(d))}</span>`;
    return `<div class="card" data-pi="${p.i}">
      <div class="cbody">
        <div class="ctitle">${esc(p.m||p.v)}</div>
        <div class="cdesc fl"><span class="tag ${TCLS[p.t]||"t-n"}">${p.t}</span>
          <span class="un">→ ${esc(p.u||"—")}</span>${uniTag(p.u)}</div>
      </div>
      <div class="cscore">${dl}</div>
    </div>`;
  }).join("") || `<div class="empty">暂无</div>`;
  bindCards($("#spList"), "pi");
}

/* ---------- program ---------- */
function openProg(i){
  const p = D.progs[i];
  const m = D.majors[p.k] || null;
  $("#ppTitle").textContent = p.m || p.v;
  const delta = p.d1;
  const dl = delta==null ? `<span class="delta flat">—</span>`
    : `<span class="delta ${delta>0?"up":delta<0?"down":"flat"}">${delta>0?"+":""}${fmt(delta)}</span>`;
  const unit = isBen(p.t) ? "660 分制" : "450 分制";
  $("#ppBody").innerHTML = `
    <div class="hero" style="margin-bottom:12px">
      <span class="tag ${TCLS[p.t]||"t-n"}">${p.t}</span>
      <h1>${esc(p.s)}</h1>
      <div class="meta">
        <div><b>专业</b><span>${esc(p.m||p.v)}${p.v&&p.v!==p.m?` <span class="mut">（志愿名 ${esc(p.v)}）</span>`:""}</span></div>
        <div><b>对接</b><span>${esc(p.u||"—")}${uniTag(p.u)}${uniLv(p.u)}</span></div>
        ${p.d&&p.d.length?`<div><b>就读区</b><span>${p.d.join(" / ")}</span></div>`:""}
        <div><b>状态</b><span>${D.st_label[p.st]||"—"}</span></div>
      </div>
    </div>

    <div class="score">
      <div class="big">${fmt(p.a26)}<small>2026 线</small></div>
      <div style="flex:1"></div>
      <div style="text-align:right">${dl}
        <div style="font-size:10.5px;color:var(--sub);margin-top:4px">${unit}</div></div>
    </div>

    <div class="blk">
      <h3>三年最低录取线</h3>
      <div class="bars">
        <div class="bar"><b>${fmt(p.a24)}</b><i>2024</i></div>
        <div class="bar"><b>${fmt(p.a25)}</b><i>2025</i></div>
        <div class="bar" style="background:#FFE0CF"><b>${fmt(p.a26)}</b><i>2026</i></div>
      </div>
      ${p.gk?`<div class="note" style="margin-top:11px">2026 高考投档线 <b>${p.gk}</b>（${esc(p.gkl||"")}）</div>`:""}
    </div>

    ${m&&m.core?`<div class="blk"><h3>学什么</h3><p>${esc(m.core)}</p></div>`:""}
    ${m&&m.job?`<div class="blk"><h3>出来能干嘛</h3><p>${esc(m.job)}</p></div>`:""}
    ${m&&m.note?`<div class="blk"><h3>同类分布</h3><p class="mut" style="font-size:12.5px">${esc(m.note)}</p></div>`:""}
    ${(!m||!m.core)&&(!m||!m.job)?`<div class="note">这个专业点暂未收录专业介绍，先看分数和对接高校。</div>`:""}
  `;
  pushPage("#progPage");
}

/* ---------- pages ---------- */
const stack = [];
function pushPage(sel){
  const el = $(sel);
  if(stack.includes(sel)) return;
  el.classList.add("on"); el.scrollTop = 0; stack.push(sel);
}
function popPage(){
  const sel = stack.pop();
  if(sel) $(sel).classList.remove("on");
}
document.querySelectorAll("[data-back]").forEach(b=>b.onclick = popPage);
window.addEventListener("keydown", e=>{
  if(e.key === "Escape"){ if(stack.length) popPage(); else closeSheet(); }
});

function bindCards(root, attr="si"){
  root.querySelectorAll(".card").forEach(c=>{
    c.onclick = ()=> attr==="si" ? openSchool(+c.dataset.si) : openProg(+c.dataset.pi);
  });
}

/* ---------- search ---------- */
$("#searchBtn").onclick = ()=>{
  if(stack.includes("#searchPage")) return;
  $("#seBody").innerHTML = `<div class="search"><span style="font-size:15px">🔍</span>
      <input id="sq" placeholder="搜学校 / 专业 / 对接高校" autocomplete="off"></div>
    <div id="seList"><div class="empty">输入学校、专业或高校名</div></div>`;
  pushPage("#searchPage");
  const inp = $("#sq");
  let t = null;
  inp.addEventListener("input", ()=>{
    clearTimeout(t);
    const v = inp.value.trim();
    t = setTimeout(()=>renderSearch(v), 180);
  });
  inp.focus();
};
function renderSearch(v){
  if(!v){ $("#seList").innerHTML = `<div class="empty">输入学校、专业或高校名</div>`; return; }
  const low = v.toLowerCase();
  const hits = D.progs.filter(p=>
    (p.s||"").toLowerCase().includes(low) ||
    (p.m||"").toLowerCase().includes(low) ||
    (p.v||"").toLowerCase().includes(low) ||
    (p.u||"").toLowerCase().includes(low)
  ).sort((a,b)=>(b.a26||0)-(a.a26||0)).slice(0, 60);
  $("#seList").innerHTML = hits.length ? hits.map(p=>`
    <div class="card" data-pi="${p.i}">
      <div class="cbody">
        <div class="ctitle">${esc(p.m||p.v)}</div>
        <div class="cdesc fl">${esc(p.s)} · <span class="tag ${TCLS[p.t]||"t-n"}">${p.t}</span>
          <span class="un">→ ${esc(p.u||"—")}</span>${uniTag(p.u)}</div>
      </div>
      <div class="cscore"><b>${fmt(p.a26)}</b><i>2026</i></div>
    </div>`).join("") : `<div class="empty">没搜到「${esc(v)}」</div>`;
  bindCards($("#seList"), "pi");
}
</script>
</body>
</html>
